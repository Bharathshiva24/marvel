<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Timeline · Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#07080c;--s1:#0f1118;--s2:#151821;--s3:#1d212c;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--ink:#f5f2ed;--mut:#9aa0ad;--dim:#666b78;--red:#e2232a;--red2:#ff4d52;--ok:#43d39a;--warn:#f2b84b;--fd:"Big Shoulders Display",Impact,sans-serif;--fb:Manrope,system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:2px}
.hide{display:none!important}
h1,h2,h3{font-family:var(--fd);font-weight:900;line-height:1;margin:0;letter-spacing:.3px}
.muted{color:var(--mut)}.tiny{font-size:13px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:2px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.red{background:linear-gradient(180deg,#ef2b32,#c8161d);border-color:#ff474d}
.btn.red:hover{background:linear-gradient(180deg,#ff3a40,#d81c23)}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:2px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:#ff9ea1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.in{height:44px;border-radius:2px;border:1px solid var(--line2);background:var(--s1);padding:0 14px;font-size:15px;color:var(--ink);outline:0;width:100%}
.in:focus{border-color:rgba(255,77,82,.6);box-shadow:0 0 0 4px rgba(226,35,42,.14)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:2px;padding:3px;background:var(--s1)}
.seg button{border:0;background:none;border-radius:2px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:#0b0b0f}
/* sign-in */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 30% 0,rgba(226,35,42,.18),transparent 60%)}
.gate form{width:min(420px,100%);background:var(--s1);border:1px solid var(--line2);border-radius:2px;padding:30px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.gate h1{font-size:40px;text-transform:uppercase;margin:18px 0 6px}
.err{color:#ff9ea1;font-size:14px;margin:10px 0 0;min-height:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:32px;height:32px}
.brand b{font:900 22px/1 var(--fd);text-transform:uppercase;letter-spacing:.5px}.brand b span{color:var(--red)}
/* app shell */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;background:rgba(7,8,12,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:2px;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--line2);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge.saving i{background:var(--warn);animation:bl 1s infinite}.badge.err i{background:var(--red2)}
@keyframes bl{50%{opacity:.3}}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 62px)}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:2px;border:0;background:none;color:var(--mut);font-weight:700;text-align:left}
.side button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.side button.on{color:var(--ink);background:rgba(255,255,255,.08)}
.side button svg{width:18px;height:18px;flex:none}
.side button em{margin-left:auto;font-style:normal;font-size:12px;color:var(--dim);font-weight:700}
.side .lab{font-size:12px;color:var(--dim);font-weight:700;padding:16px 12px 6px}
main{padding:28px clamp(16px,3vw,40px) 80px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:clamp(34px,4vw,52px);text-transform:uppercase}
.head p{margin:8px 0 0;color:var(--mut);max-width:70ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tools .in{max-width:340px}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}.side button{width:auto;flex:none;padding:9px 12px}.side .lab,.side button em{display:none}.top .vs{display:none}}
/* image grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,170px),1fr));gap:16px}
.slot{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:2px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.slot.drag{border-color:var(--red2);transform:scale(1.02);box-shadow:0 0 0 4px rgba(226,35,42,.2)}
.pv{position:relative;aspect-ratio:var(--ar,2/3);background:linear-gradient(135deg,#1b1e28,#0c0d12);display:grid;place-items:center;overflow:hidden}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv .ph{font:900 34px var(--fd);color:rgba(255,255,255,.18);text-align:center;padding:10px;line-height:1}
.pv .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:2px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14)}
.pv .tag.live{background:rgba(67,211,154,.2);border-color:rgba(67,211,154,.6);color:#bff5de}
.pv .busy{position:absolute;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;font-weight:700;font-size:13px}
.pv .busy i{display:block;width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--red2);animation:sp 0.8s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pv .drop{position:absolute;inset:0;display:none;place-items:center;background:rgba(226,35,42,.35);font-weight:800}
.slot.drag .drop{display:grid}
.panel.social{grid-column:1/-1}.sgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}@media(max-width:900px){.sgrid{grid-template-columns:1fr}}
.ogcard{border:1px solid var(--line2);background:#1f2c34;overflow:hidden;border-radius:2px;max-width:560px}.ogimg{aspect-ratio:1200/630;background:#0b0d14}.ogimg img{width:100%;height:100%;object-fit:cover;display:block}.ogtxt{padding:12px 14px;display:grid;gap:4px;color:#e9edef}.ogtxt b{font-size:15px}.ogtxt span{font-size:13px;color:#aebac1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ogtxt small{font-size:12px;color:#8696a0}
.acts:has(+.acts2){padding-bottom:6px}.acts2{padding-top:0!important;margin-top:0!important;gap:6px}.acts2 .btn{flex:1;justify-content:center}.btn.ghost{background:transparent;border-color:var(--line);color:var(--mut)}.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}.btn.ghost svg{width:14px;height:14px}
.k-planets .pv{background:repeating-conic-gradient(#171a23 0 25%,#10121a 0 50%) 0 0/18px 18px}.k-planets .pv img{object-fit:contain!important;padding:8px}
.meta{padding:12px 12px 6px}
.meta b{display:block;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--dim);font-size:12px}
.acts{display:flex;gap:6px;padding:6px 12px 12px;margin-top:auto}
.acts .btn{flex:1}.acts .btn.danger{flex:0 0 40px;padding:0}
.empty{padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:2px}
/* videos */
.vgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.tlist{background:var(--s1);border:1px solid var(--line);border-radius:2px;padding:10px;position:sticky;top:80px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.tlist .in{flex:none}.tlist .rows{overflow:auto;margin-top:8px}
.tlist button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:2px;text-align:left}
.tlist button:hover{background:rgba(255,255,255,.04)}
.tlist button.on{background:rgba(255,255,255,.09)}
.tlist button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tlist button em{font-style:normal;font-size:12px;font-weight:800;min-width:22px;height:22px;border-radius:2px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--mut)}
.tlist button em.has{background:var(--red);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:2px;padding:22px}
.add{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,.7fr) auto;gap:10px;align-items:start}
@media(max-width:760px){.add{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:13px;color:var(--dim);margin-top:8px}
.vitem{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.vitem .th{position:relative;aspect-ratio:16/9;border-radius:2px;overflow:hidden;background:#000;border:0;padding:0}
.vitem .th img{width:100%;height:100%;object-fit:cover}
.vitem .th svg{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;color:#fff;filter:drop-shadow(0 2px 8px #000)}
.vitem .f{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.vitem .ord{display:flex;gap:4px}
.vitem .ord .btn{width:36px;padding:0}
@media(max-width:760px){.vitem{grid-template-columns:110px minmax(0,1fr)}.vitem .ord{grid-column:1/-1}.vitem .f{grid-template-columns:minmax(0,1fr)}}
.builtin{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:2px;background:rgba(255,255,255,.03);border:1px dashed var(--line2);font-size:14px;color:var(--mut);margin-top:14px}
.setup ol{padding-left:20px;margin:10px 0 0}.setup li{margin:0 0 12px}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.check i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;flex:none}
.check i.y{background:var(--ok);color:#03150d}.check i.n{background:var(--red);color:#fff}
code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:2px;font-size:13px}
.vmodal{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
.vmodal .box{width:min(960px,100%);border-radius:2px;overflow:hidden;background:#000}
.vmodal .fr{position:relative;aspect-ratio:16/9}.vmodal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vmodal .bar{display:flex;justify-content:flex-end;padding:10px;background:var(--s1)}
@media(max-width:560px){.top{gap:8px;padding:0 12px}.brand b{font-size:18px;white-space:nowrap}.badge span{display:none}.badge{padding:0 10px}}
.brandgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media(max-width:1000px){.brandgrid{grid-template-columns:minmax(0,1fr)}}
.mock{border-radius:2px;overflow:hidden;border:1px solid var(--line2);background:#07080c}
.mock .mbar{display:flex;align-items:center;gap:14px;height:64px;padding:0 18px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line)}
.mock .mbar img{height:36px;max-width:200px;object-fit:contain}
.mock .mbar .ghost{display:flex;gap:8px;margin-left:auto}.mock .mbar .ghost i{width:64px;height:28px;border-radius:2px;background:rgba(255,255,255,.06)}
.mock.light{background:#f5f2ed}.mock.light .mbar{border-color:rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;padding:10px 10px 0;background:#1d212c}
.tabs .tb{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:2px;font-size:13px;font-weight:600;color:#d6d3cf;max-width:220px}
.tabs .tb.on{background:#0f1118;color:#fff}.tabs .tb img,.tabs .tb svg{width:16px;height:16px;flex:none;object-fit:contain}
.favs{display:flex;gap:18px;align-items:flex-end;padding:18px;flex-wrap:wrap}
.favs div{text-align:center;font-size:12px;color:var(--dim)}
.favs img,.favs svg{display:block;margin:0 auto 6px;object-fit:contain;border-radius:2px}
.brandacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.drop{border:1.5px dashed var(--line2);border-radius:2px;padding:16px;margin-top:14px;text-align:center;color:var(--mut);font-size:14px;transition:border-color .2s,background .2s}
.drop.drag{border-color:var(--red2);background:rgba(226,35,42,.08)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:#0b0b0f;font-weight:700;padding:12px 20px;border-radius:2px;z-index:130;transition:transform .35s var(--ease);max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}.toast.bad{background:#ff6a6e;color:#fff}

/* Buttons and CTAs: square corners, max 2px */
.btn,.btn.sm,.seg,.seg button,.side button,.tlist button,.tabs .tb,.in,.vitem .th,.builtin .th,.dd-b,.dd.pill .dd-b,.dd-o,.dd-s,:focus-visible{border-radius:2px}
</style>
</head>

<div class="gate" id="gate">
 <form id="gf" autocomplete="on">
  <a class="brand" href="/"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="2" fill="#e2232a"/><path d="M9.5 20h21" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/><circle cx="11.5" cy="20" r="2.6" fill="#fff"/><circle cx="20" cy="20" r="4.2" fill="#fff"/><circle cx="28.5" cy="20" r="2.6" fill="#fff"/></svg><b>The <span>Timeline</span></b></a>

 </form>
</div>

<div id="app" class="hide">
 <header class="top">
  <a class="brand" href="/"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="2" fill="#e2232a"/><path d="M9.5 20h21" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/><circle cx="11.5" cy="20" r="2.6" fill="#fff"/><circle cx="20" cy="20" r="4.2" fill="#fff"/><circle cx="28.5" cy="20" r="2.6" fill="#fff"/></svg><b>The <span>Timeline</span></b></a>

 </header>
 <div class="shell">
  <nav class="side" id="side" aria-label="Admin sections"></nav>

 </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const MARK='<svg viewBox="0 0 64 64"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d52"/><stop offset="1" stop-color="#b3141a"/></linearGradient></defs><rect width="64" height="64" rx="2" fill="url(#fg)"/><path d="M15 32h34" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/><circle cx="18.4" cy="32" r="4.2" fill="#fff"/><circle cx="32" cy="32" r="6.8" fill="#fff"/><circle cx="45.6" cy="32" r="4.2" fill="#fff"/></svg>';
const DEFLOGO=`<span class="brand" style="pointer-events:none"><svg viewBox="0 0 40 40" style="width:32px;height:32px"><rect width="40" height="40" rx="2" fill="#e2232a"/><path d="M9.5 20h21" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/><circle cx="11.5" cy="20" r="2.6" fill="#fff"/><circle cx="20" cy="20" r="4.2" fill="#fff"/><circle cx="28.5" cy="20" r="2.6" fill="#fff"/></svg><b>The <span>Timeline</span></b></span>`;
function applyAdminBrand(){const a=$(".top .brand");if(!a.dataset.def)a.dataset.def=a.innerHTML;a.innerHTML=C.brand.logo?`<img src="${esc(C.brand.logo)}" alt="The Timeline" style="height:32px;max-width:180px;object-fit:contain">`:a.dataset.def;
 const f=C.brand.favicon||"favicon.svg";$$('link[rel="icon"]').forEach(l=>l.setAttribute("href",f))}
function vBrand(){const lg=C.brand.logo,fv=C.brand.favicon,fimg=(sz)=>fv?`<img src="${esc(fv)}" alt="" style="width:${sz}px;height:${sz}px">`:MARK.replace("<svg",`<svg style="width:${sz}px;height:${sz}px"`);
 const logoView=lg?`<img src="${esc(lg)}" alt="Logo preview">`:DEFLOGO;
 $("#main").innerHTML=`<div class="head"><div><h1>Logo, favicon &amp; sharing</h1><p>Replace the site's logo, browser icon and link preview image. Changes go live within a minute. Remove an upload to go back to the built-in The Timeline mark.</p></div></div>
 <div class="brandgrid">
 <div class="panel"><h3 style="font-size:26px">Logo</h3><p class="tiny" style="margin:6px 0 14px">Shown in the header on every page, 36 px tall (up to 200 px wide). Best as an SVG or a transparent PNG at least 600 px wide.</p>
  <div class="mock"><div class="mbar">${logoView}<span class="ghost"><i></i><i></i><i></i></span></div></div>
  <div class="mock light" style="margin-top:10px"><div class="mbar">${logoView}<span class="ghost"><i style="background:rgba(0,0,0,.06)"></i><i style="background:rgba(0,0,0,.06)"></i></span></div></div>
  <p class="tiny" style="margin:8px 0 0">Light preview shown for reference — the site itself is dark.</p>
  <div class="drop" data-drop="logo">Drop an image here, or use the button below</div>
  <div class="brandacts"><label class="btn red">${ICO.up}${lg?"Replace logo":"Upload logo"}<input type="file" class="hide" accept="image/svg+xml,image/png,image/webp,image/jpeg" data-bup="logo"></label>${lg?`<button class="btn danger" data-brm="logo">Remove</button>`:""}<span class="tiny" style="align-self:center">${lg?"Custom logo is live":"Using the built-in logo"}</span></div></div>
 <div class="panel"><h3 style="font-size:26px">Favicon</h3><p class="tiny" style="margin:6px 0 14px">The icon in browser tabs, bookmarks and home-screen shortcuts. Use a square SVG or PNG, at least 512 × 512.</p>
  <div class="mock"><div class="tabs"><span class="tb on">${fimg(16)}<span>The Timeline</span></span><span class="tb">${ICO.img}<span>New tab</span></span></div><div class="favs">${[16,32,64,128].map(z=>`<div>${fimg(z)}${z}px</div>`).join("")}</div></div>
  <div class="drop" data-drop="favicon">Drop an image here, or use the button below</div>
  <div class="brandacts"><label class="btn red">${ICO.up}${fv?"Replace favicon":"Upload favicon"}<input type="file" class="hide" accept="image/svg+xml,image/png,image/webp,image/jpeg" data-bup="favicon"></label>${fv?`<button class="btn danger" data-brm="favicon">Remove</button>`:""}<span class="tiny" style="align-self:center">${fv?"Custom favicon is live":"Using the built-in icon"}</span></div></div>
 <div class="panel social"><h3 style="font-size:26px">Social preview</h3><p class="tiny" style="margin:6px 0 14px">The image shown when the site's link is shared on WhatsApp, X, Facebook, LinkedIn, Slack and iMessage. Use a 1200 × 630 (1.91:1) image; anything else is cropped to fit from the centre. Keep text and faces away from the edges.</p>
  <div class="sgrid"><div class="ogcard"><div class="ogimg">${C.brand.social?`<img src="${esc(C.brand.social)}" alt="Social preview">`:`<img src="/og-default.png" alt="Built-in social preview">`}</div><div class="ogtxt"><b>The Timeline</b><span>An interactive guide to the Marvel Cinematic Universe: timeline, watch order, what to watch first…</span><small>marvel-timeline.vercel.app</small></div></div>
  <div><div class="drop" data-drop="social" style="margin-top:0">Drop an image here, or use the button below</div>
  <div class="brandacts"><label class="btn red">${ICO.up}${C.brand.social?"Replace image":"Upload image"}<input type="file" class="hide" accept="image/png,image/webp,image/jpeg" data-bup="social"></label>${C.brand.social?`<button class="btn danger" data-brm="social">Remove</button>`:""}<span class="tiny" style="align-self:center">${C.brand.social?"Custom preview is live":"Using the built-in preview"}</span></div>
  <p class="tiny" style="margin:12px 0 0">Apps cache previews. To see a new image straight away, share the link with something added to the end, like <code>?v=2</code>.</p></div></div></div>
 </div>`;
 $$("[data-bup]").forEach(i=>i.onchange=()=>{const f=i.files[0];if(f)uploadBrand(i.dataset.bup,f);i.value=""});
 $$("[data-brm]").forEach(b=>b.onclick=()=>removeBrand(b.dataset.brm));
 $$("[data-drop]").forEach(d=>{d.ondragover=e=>{e.preventDefault();d.classList.add("drag")};d.ondragleave=()=>d.classList.remove("drag");d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");const f=[...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));f?uploadBrand(d.dataset.drop,f):toast("Drop an image file",true)}})}
async function brandBlob(key,file){if(key==="social"){let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw new Error("That file couldn't be read as an image.")}
  const W=1200,H=630,s=Math.max(W/bmp.width,H/bmp.height),w=bmp.width*s,h=bmp.height*s,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.fillStyle="#07080c";g.fillRect(0,0,W,H);g.drawImage(bmp,(W-w)/2,(H-h)/2,w,h);
  let q=.88,b;do{b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));q-=.1}while(b&&b.size>450_000&&q>.5);return b}
 if(file.type==="image/svg+xml"){if(file.size>1_000_000)throw new Error("That SVG is over 1 MB.");return file}
 let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw new Error("That file couldn't be read as an image.")}
 const max=key==="logo"?1200:512,s=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
 let cw=w,ch=h,dx=0,dy=0;if(key==="favicon"){const m=Math.max(w,h);cw=ch=m;dx=(m-w)/2;dy=(m-h)/2}
 const c=document.createElement("canvas");c.width=cw;c.height=ch;c.getContext("2d").drawImage(bmp,dx,dy,w,h);
 return await new Promise(r=>c.toBlob(r,"image/png"))}
async function uploadBrand(key,file){const d=$(`[data-drop="${key}"]`);if(d)d.textContent="Uploading…";
 try{const blob=await brandBlob(key,file);const j=await api(`/api/upload?kind=brand&key=${key}`,{method:"POST",headers:{"content-type":blob.type},body:blob});
  const old=C.brand[key];C.brand[key]=j.url;await save();if(old)api(`/api/upload?url=${encodeURIComponent(old)}`,{method:"DELETE"}).catch(()=>{});
  toast(({logo:"Logo",favicon:"Favicon",social:"Social preview"})[key]+" updated — live on the site")}
 catch(e){toast(e.message,true)}finally{applyAdminBrand();side();if(view==="brand")vBrand()}}
async function removeBrand(key){const old=C.brand[key];if(!old)return;delete C.brand[key];try{await save();api(`/api/upload?url=${encodeURIComponent(old)}`,{method:"DELETE"}).catch(()=>{});toast("Removed — the built-in "+({logo:"logo",favicon:"icon",social:"preview"})[key]+" is back")}catch(e){C.brand[key]=old}applyAdminBrand();side();vBrand()}
/* ---- setup ---- */
async function vSetup(){let s=STATUS;try{s=await probe(KEY)}catch(e){}
 const n=k=>Object.keys(C[k]).length,vn=Object.values(C.videos).reduce((a,l)=>a+l.length,0);
 $("#main").innerHTML=`<div class="head"><div><h1>Setup &amp; status</h1><p>How the admin panel is wired up, and what's currently live.</p></div></div>
 <div class="panel setup"><h3 style="font-size:24px">Status</h3>${setupHTML(s)}<div class="check"><i class="y">✓</i><span>Last published: <b>${C.updated?new Date(C.updated).toLocaleString():"nothing yet"}</b></span></div>
 <div class="check"><i class="y">✓</i><span>${n("posters")} posters · ${n("characters")} character images · ${n("other")} other images · ${n("planets")} planets · ${vn} videos</span></div></div>
 <div class="panel setup" style="margin-top:18px"><h3 style="font-size:24px">How it works</h3><ol>
 <li>Uploads and video links are saved to this project's <b>Vercel Blob</b> store. Each save publishes a new version and keeps the last 10 as a backup.</li>
 <li>The public site checks for new content when a page opens, every minute while it's open, and whenever the tab comes back into view. Visitors see changes within a minute, without a redeploy.</li>
 <li>Anything you haven't uploaded falls back to <code>images.js</code> in the GitHub repo, then to the built-in artwork.</li>
 <li>To change the password, update <code>ADMIN_PASSWORD</code> in Vercel and redeploy.</li></ol></div>`}
/* ---- boot: resume a signed-in session ---- */
(async()=>{let k="";try{k=sessionStorage.getItem("mcu-admin")||""}catch(e){}
 if(!k){$("#pw").focus();try{const s=await probe("");STATUS=s;if(!s.configured||!s.password){$("#gsetup").innerHTML=`<b>Finish setup in Vercel</b>${setupHTML(s)}`;$("#gsetup").classList.remove("hide")}}catch(e){$("#gerr").textContent=e.message}return}
 try{const s=await probe(k);STATUS=s;if(s.authed){KEY=k;start(s)}else{try{sessionStorage.removeItem("mcu-admin")}catch(e){}$("#pw").focus()}}catch(e){$("#gerr").textContent=e.message}})();
}
</script>
</body>
